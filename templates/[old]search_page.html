<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search - MediCare</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #ffcccc, #ff9999);
      text-align: center;
    }
    h1 { margin-top: 2em; color: #333; }
    .search-container {
      margin: 2em auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    select, input {
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .suggestions {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      max-width: 300px;
      margin: 0 auto;
      text-align: left;
    }
    .suggestions div {
      padding: 8px;
      cursor: pointer;
    }
    .suggestions div:hover {
      background: #f0f0f0;
    }
    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #e74c3c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
  <h1>Book a Doctor's Appointment in Just 10 Minutes with MediCare</h1>
  <p>Search doctors or patients below</p>

  <form method="POST" action="/search" class="search-container">
    <select name="role" id="role">
      <option value="DOCTOR">Doctor</option>
      <option value="PATIENT">Patient</option>
    </select>
    <input type="text" name="name" id="searchBox" placeholder="Search by name..." autocomplete="off">
    <button type="submit">Search</button>
  </form>

  <div id="suggestions" class="suggestions"></div>

  <script>
    const searchBox = document.getElementById('searchBox');
    const roleSelect = document.getElementById('role');
    const suggestionsDiv = document.getElementById('suggestions');

    searchBox.addEventListener('input', () => {
      const query = searchBox.value;
      const role = roleSelect.value;
      if (query.length < 2) { suggestionsDiv.innerHTML = ''; return; }
      fetch(`/search_suggestions?q=${query}&role=${role}`)
        .then(res => res.json())
        .then(data => {
          suggestionsDiv.innerHTML = '';
          data.forEach(item => {
            const div = document.createElement('div');
            div.textContent = item.name;
            div.onclick = () => window.location.href = `/profile/${item.id}`;
            suggestionsDiv.appendChild(div);
          });
        });
    });
  </script>
</body>
</html>
