<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Appointments - MediCare</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(to bottom right, #ffcccc, #ff9999);
      font-family: Arial, sans-serif;
    }
    h1 { font-size: 2em; color: #2c3e50; margin: 1em 0; }
    table {
      width: 80%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    th, td { padding: 12px 16px; border-bottom: 1px solid #eee; text-align: center; }
    th { background: #e74c3c; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .btn {
      margin-top: 1.5em;
      padding: 10px 20px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h1>My Appointments</h1>
  <table>
    <tr>
      <th>Doctor</th>
      <th>Date</th>
      <th>Reason</th>
    </tr>
    {% for appt in appointments %}
    <tr>
      <td>{{ appt[0] }}</td>
      <td>{{ appt[1] }}</td>
      <td>{{ appt[2] }}</td>
    </tr>
    {% endfor %}
  </table>
  <button class="btn" onclick="window.location.href='/appoint'">Book New Appointment</button>
</body>
</html>
